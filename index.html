<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Universal Local Anomalous Wiki</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
/* =======================================================================
   PALETA DE CORES
   Muda essas variáveis aqui pra trocar a cor de tudo o site de uma vez.
   Elas são usadas em várias regras abaixo como var(--nome-da-cor).
   ======================================================================= */
:root {
  --paper: #e8e0c7;
  --paper-dark: #d9cfa9;
  --ink: #201c14;
  --ink-faded: #4a4231;
  --stamp-red: #7d1c14;
  --redact: #17140f;
  --rule: #a4956b;
}
/* Fundo geral da página, por trás do card do post (o "chão" escuro) */
html, body {
  margin: 0;
  min-height: 100%;
  background-color: #16140f;
  background-image:
    radial-gradient(ellipse at center, #221f17 0%, #0e0c08 100%);
  color: var(--ink);
  font-family: "Courier Prime", "Courier New", monospace;
  overflow: hidden;
}
body { margin: 0; }

/* Título grande no topo do site */
h1 {
  text-align: center;
  padding: 22px 20px 4px 20px;
  margin: 0;
  flex: 0 0 auto;
  color: #e8e0c7;
  font-family: "Special Elite", "Courier New", monospace;
  font-size: 22px;
  letter-spacing: 3px;
  text-transform: uppercase;
}
/* Legenda pequena embaixo do título */
.subtitle {
  text-align: center;
  color: #8c8266;
  font-family: "Courier Prime", monospace;
  font-size: 11px;
  letter-spacing: 4px;
  text-transform: uppercase;
  margin: 0 0 16px 0;
}

/* Área que centraliza o post atual na tela.
   "perspective" é o que dá profundidade 3D pro efeito de folha virando. */
#viewer {
  width: 100%;
  height: calc(100vh - 92px);
  height: calc(100svh - 92px);
  box-sizing: border-box;
  padding: 12px 16px 16px 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: visible;
  perspective: 1500px;
}
/* Caixa que envolve cada post. padding-right reserva espaço
   pros botões redondos de comentário/conta no canto direito. */
.post-wrap {
  position: relative;
  width: min(600px, 100%);
  padding-right: 58px;
  box-sizing: border-box;
  overflow: visible;
}

/* ANIMAÇÃO DE PÁGINA VIRANDO: toda vez que troca de post, o JS
   adiciona a classe "page-enter" no post novo (ver showPost() no JS).
   Pra mudar a velocidade, troca o "0.55s". Pra mudar o ângulo da
   virada, troca o "-100deg" no keyframe abaixo. */
.post-wrap.page-enter {
  transform-origin: top center;
  animation: pageFlipIn 0.55s cubic-bezier(.22, 1, .36, 1) both;
}
@keyframes pageFlipIn {
  0% { transform: rotateX(-100deg) translateY(-14%); opacity: 0.25; }
  55% { opacity: 1; }
  100% { transform: rotateX(0deg) translateY(0); opacity: 1; }
}

/* A "folha de papel" em si: cor, borda e sombra do card do post */
.post {
  position: relative;
  width: 100%;
  height: auto;
  background:
    repeating-linear-gradient(
      0deg,
      rgba(0,0,0,0.02) 0px,
      rgba(0,0,0,0.02) 1px,
      transparent 1px,
      transparent 3px
    ),
    var(--paper);
  border: 1px solid var(--ink);
  border-radius: 0;
  padding: 18px 16px 14px 16px;
  box-sizing: border-box;
  overflow: visible;
  display: flex;
  flex-direction: column;
  box-shadow: 5px 5px 0 rgba(0,0,0,0.35);
}
/* Friso pontilhado decorativo no topo do post (puramente visual) */
.post::before {
  content: "";
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 6px;
  background-image: repeating-linear-gradient(90deg, var(--ink) 0 6px, transparent 6px 12px);
  opacity: 0.35;
}

/* Quando os comentários estão abertos (classe "comments-open" no post):
   o post cresce de altura e esconde título/imagem/texto, deixando
   só a caixa de comentário visível. */
.post.comments-open { height: calc(100svh - 185px) !important; }
.post.comments-open .title,
.post.comments-open .body-shell,
.post.comments-open .case-meta { display: none !important; }
.post.comments-open .comment-box {
  position: relative;
  top: auto; left: auto; right: auto; bottom: auto;
  height: 100%;
  background: #f3dd7e;
  border: 1px solid #b8a13a;
  box-shadow: none;
  padding: 10px;
  transform: rotate(-0.5deg);
}
/* Linha "Processo Nº XXXX / CLASSIFICAÇÃO" no topo de cada post */
.case-meta {
  display: flex;
  justify-content: space-between;
  font-size: 10px;
  color: var(--ink-faded);
  letter-spacing: 1px;
  text-transform: uppercase;
  border-bottom: 1px dashed var(--rule);
  padding-bottom: 6px;
  margin-bottom: 10px;
}

/* Título do post (vem do campo "title" do posts.json) */
.title {
  text-align: center;
  margin: 4px 0 14px 0;
  font-family: "Special Elite", "Courier New", monospace;
  font-weight: normal;
  font-size: 18px;
  letter-spacing: 1px;
  text-transform: uppercase;
  flex: 0 0 auto;
  border-bottom: 2px double var(--ink);
  padding-bottom: 10px;
}
/* Selinho da categoria (ENTIDADE/OBJETO/EVENTO/LOCAL...), vem do
   campo "tag" do posts.json. Fica no canto superior direito do post. */
.tag {
  position: absolute;
  top: -12px;
  right: 10px;
  background: var(--paper);
  color: var(--stamp-red);
  padding: 4px 10px;
  font-size: 11px;
  font-family: "Special Elite", monospace;
  border: 2px solid var(--stamp-red);
  border-radius: 3px;
  text-transform: uppercase;
  letter-spacing: 2px;
  transform: rotate(-3deg);
  z-index: 12;
}
/* CARIMBO DE CLASSIFICAÇÃO (CONFIDENCIAL / SECRETO / ULTRASSECRETO...).
   O texto vem da função getClassificationLabel() no JS, calculado a
   partir do campo "nivel" de cada post.
   - "right" e "bottom": posição (negativo em "right" empurra pra fora
     do post, atravessando a borda).
   - "rotate(-14deg)": ângulo de inclinação do carimbo. */
.stamp {
  position: absolute;
  right: -40px;
  bottom: 14px;
  font-family: "Special Elite", monospace;
  font-size: 13px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--stamp-red);
  border: 3px solid var(--stamp-red);
  border-radius: 4px;
  padding: 4px 10px;
  transform: rotate(-14deg);
  opacity: 1;
  pointer-events: none;
  z-index: 9;
  background: var(--paper);
  box-shadow: 2px 2px 0 rgba(0,0,0,0.25);
}
/* Os dois botões redondos no canto direito de cada post:
   um abre os comentários, o outro abre a conta/login. */
.comment-btn, .account-btn {
  position: absolute;
  right: 10px;
  width: 42px;
  height: 42px;
  padding: 0;
  border: 1px solid var(--ink);
  background: var(--paper);
  cursor: pointer;
  user-select: none;
  z-index: 11;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0.92;
  transition: opacity 0.2s, transform 0.2s;
}
.comment-btn { top: 34px; }
.account-btn { top: 80px; }
.comment-btn svg, .account-btn svg { width: 22px; height: 22px; display: block; }
.comment-btn:hover, .account-btn:hover { opacity: 1; transform: scale(1.05); }
/* Área com rolagem que contém a imagem e o texto do post */
.body-shell {
  position: relative;
  flex: 0 0 auto;
  max-height: calc(100svh - 250px);
  overflow-y: auto;
  overflow-x: hidden;
  padding-right: 2px;
  box-sizing: border-box;
}
/* Moldura tipo "foto anexada ao processo" (estilo polaroid, meio torta) */
.image-container {
  width: 46%;
  margin: 0 auto 16px auto;
  background: #fdfaf0;
  padding: 6px 6px 20px 6px;
  border: 1px solid #b8ac82;
  box-shadow: 3px 3px 0 rgba(0,0,0,0.25);
  transform: rotate(-1.5deg);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
}
/* A imagem/vídeo em si. O "filter" dá aquele tom meio sépia/antigo.
   Pra tirar o efeito sépia, apaga a linha do filter. */
.post .main-media {
  width: 100%;
  height: auto;
  display: block;
  max-width: 100%;
  opacity: 0;
  filter: sepia(0.35) contrast(1.05) brightness(0.96) saturate(0.85);
  transition: opacity 0.3s ease-in-out;
}
.post .main-media.loaded { opacity: 1; }
.text-shell { position: relative; overflow: visible; }
/* Texto principal do post (campo "text" do posts.json).
   text-align: left evita o problema de espaçamento estranho que
   acontecia com "justify" em linhas curtas. */
.text {
  text-align: left;
  line-height: 1.7;
  font-family: "Courier Prime", "Courier New", monospace;
  font-size: 14px;
  color: var(--ink);
  white-space: pre-line;
  overflow-wrap: anywhere;
}
/* CAIXA DE COMENTÁRIOS, com visual de post-it amarelo.
   Fica escondida (atributo "hidden") até clicar no botão de comentário. */
.comment-box {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  z-index: 20;
  background: #f3dd7e;
  padding: 12px;
  border-radius: 0;
  border: 1px solid #b8a13a;
  display: flex;
  flex-direction: column;
  gap: 8px;
  box-sizing: border-box;
  overflow: visible;
  box-shadow: 5px 5px 0 rgba(0,0,0,0.3);
  transform: rotate(-1deg);
}
/* ANIMAÇÃO DE POST-IT JOGADO: toda vez que a caixa abre, o JS
   readiciona essa classe (ver toggleComments() no JS) pra "arremessar"
   o post-it na tela. Pra mudar a velocidade, troca o "0.5s". */
.comment-box.postit-in {
  animation: postItThrow 0.5s cubic-bezier(.22, 1.5, .4, 1) both;
}
@keyframes postItThrow {
  0% { transform: translate(160px, -110px) rotate(28deg) scale(0.35); opacity: 0; }
  65% { opacity: 1; }
  100% { transform: translate(0, 0) rotate(-1deg) scale(1); opacity: 1; }
}
.comment-box[hidden] { display: none !important; }

/* Pedacinho de "fita adesiva" decorativa no topo do post-it */
.comment-box::after {
  content: "";
  position: absolute;
  top: -6px;
  left: 50%;
  transform: translateX(-50%) rotate(-2deg);
  width: 50px;
  height: 16px;
  background: rgba(232, 224, 190, 0.65);
  border: 1px solid rgba(0,0,0,0.15);
}
/* Título fixo escrito no topo do post-it. Pra mudar o texto, edita
   o "content" abaixo. */
.comment-box::before {
  content: "ANEXO — REGISTRO DE TESTEMUNHOS";
  display: block;
  font-family: "Special Elite", monospace;
  font-size: 11px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--ink-faded);
  border-bottom: 1px dashed var(--rule);
  padding-bottom: 6px;
  margin-bottom: 2px;
}
/* Lista dos comentários já enviados nesse post */
.comment-list {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  margin-bottom: 0;
  padding-right: 2px;
}
.comment {
  font-size: 13px;
  margin-bottom: 8px;
  border-bottom: 1px dashed var(--rule);
  padding-bottom: 6px;
  line-height: 1.5;
  word-break: break-word;
  color: var(--ink);
}
.comment b { font-family: "Special Elite", monospace; font-weight: normal; }
.comment-empty { font-size: 13px; opacity: 0.7; margin-bottom: 8px; font-style: italic; }
/* Formulário (caixa de texto + botão) pra escrever um novo comentário */
.comment-form { flex: 0 0 auto; }
.comment-form input,
.comment-form textarea {
  width: 100%;
  margin-top: 5px;
  margin-bottom: 5px;
  background: #fdfaf0;
  border: 1px solid var(--ink);
  color: var(--ink);
  padding: 8px;
  border-radius: 0;
  box-sizing: border-box;
  font-family: "Courier Prime", monospace;
}
.comment-form textarea { min-height: 70px; resize: vertical; }
.comment-form button {
  width: 100%;
  padding: 9px;
  background: var(--ink);
  border: none;
  color: var(--paper);
  cursor: pointer;
  border-radius: 0;
  font-family: "Special Elite", monospace;
  letter-spacing: 2px;
  text-transform: uppercase;
  font-size: 12px;
}
.comment-form button:hover { background: var(--stamp-red); }
.comment-form button:disabled { background: #6b6552; cursor: default; }
.comment-form .as-who { font-size: 11px; opacity: 0.75; margin: 0 0 4px 0; text-transform: uppercase; letter-spacing: 1px; }
/* Texto fixo no rodapé explicando como navegar entre os posts */
.hint {
  position: fixed;
  left: 50%;
  bottom: 8px;
  transform: translateX(-50%);
  font-size: 10px;
  color: #8c8266;
  letter-spacing: 1px;
  text-transform: uppercase;
  pointer-events: none;
  z-index: 5;
  white-space: nowrap;
}

/* =======================================================================
   DENÚNCIA DE COMENTÁRIO + PAINEL ADMIN (rota secreta ?painel)
   ======================================================================= */

/* Cada linha de comentário + a bolinha vermelha de denúncia ao lado */
.comment-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 6px; }
.comment-row > span { flex: 1 1 auto; }

/* A bolinha vermelha "!" que denuncia um comentário */
.report-btn {
  flex: 0 0 auto;
  border: 1px solid var(--stamp-red);
  background: var(--paper);
  color: var(--stamp-red);
  width: 18px;
  height: 18px;
  border-radius: 50%;
  font-size: 11px;
  line-height: 16px;
  text-align: center;
  cursor: pointer;
  padding: 0;
  font-weight: bold;
}
.report-btn:hover { background: var(--stamp-red); color: var(--paper); }
/* O painel admin fica escondido por padrão. Só aparece (e o feed
   normal some) quando a URL do site tem "?painel" no final — ver
   "isAdminRoute" no início do JS. */
#admin-view { display: none; }
body.admin-mode #viewer, body.admin-mode .hint, body.admin-mode h1, body.admin-mode .subtitle { display: none !important; }
body.admin-mode #admin-view {
  display: block;
  min-height: 100vh;
  box-sizing: border-box;
  padding: 40px 16px;
  font-family: "Courier Prime", monospace;
}
/* Tela de login do painel admin (pede email + senha da sua conta) */
.admin-login {
  width: min(340px, 100%);
  margin: 0 auto;
  background: var(--paper);
  border: 1px solid var(--ink);
  padding: 18px;
  box-sizing: border-box;
  box-shadow: 5px 5px 0 rgba(0,0,0,0.3);
}
.admin-login h2 {
  font-family: "Special Elite", monospace;
  font-size: 15px;
  letter-spacing: 2px;
  text-transform: uppercase;
  text-align: center;
  margin: 0 0 12px 0;
  color: var(--stamp-red);
}
.admin-login label { display: block; font-size: 11px; opacity: 0.85; margin: 10px 0 4px 0; text-transform: uppercase; letter-spacing: 1px; }
.admin-login input {
  width: 100%;
  background: #fdfaf0;
  border: 1px solid var(--ink);
  color: var(--ink);
  padding: 8px;
  box-sizing: border-box;
  font-family: "Courier Prime", monospace;
}
.admin-login button {
  width: 100%;
  margin-top: 14px;
  padding: 10px;
  background: var(--ink);
  border: none;
  color: var(--paper);
  cursor: pointer;
  font-family: "Special Elite", monospace;
  letter-spacing: 2px;
  text-transform: uppercase;
  font-size: 12px;
}
.admin-login .error-msg { color: var(--stamp-red); font-size: 12px; margin-top: 10px; min-height: 14px; }
/* Lista de comentários denunciados, exibida dentro do painel admin */
.admin-list { width: min(700px, 100%); margin: 0 auto; color: var(--paper); }
.admin-list h2 { text-align: center; font-family: "Special Elite", monospace; letter-spacing: 3px; text-transform: uppercase; color: var(--paper); }
.report-card { background: var(--paper); border: 1px solid var(--ink); padding: 12px; margin-bottom: 12px; color: var(--ink); box-shadow: 4px 4px 0 rgba(0,0,0,0.3); }
.report-card .meta { font-size: 11px; opacity: 0.65; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 1px; font-family: "Special Elite", monospace; }
.report-card .txt { font-size: 14px; margin-bottom: 10px; word-break: break-word; font-family: "Courier Prime", monospace; }
.report-card .actions { display: flex; gap: 8px; }
.report-card button {
  flex: 1;
  padding: 8px;
  border: none;
  cursor: pointer;
  color: #fff;
  font-family: "Special Elite", monospace;
  letter-spacing: 1px;
  text-transform: uppercase;
  font-size: 11px;
}
.report-card .btn-del { background: var(--stamp-red); }
.report-card .btn-dismiss { background: var(--ink); }
.report-empty { text-align: center; opacity: 0.85; margin-top: 40px; color: var(--paper); font-family: "Special Elite", monospace; letter-spacing: 1px; }

/* =======================================================================
   MODAL DE CRIAR CONTA / LOGIN (aparece na primeira visita do usuário)
   ======================================================================= */

/* Fundo escuro que cobre a tela inteira atrás do modal */
.account-overlay {
  position: fixed;
  inset: 0;
  background: rgba(10,9,6,0.85);
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  box-sizing: border-box;
}
.account-overlay[hidden] { display: none !important; }
/* Caixinha do modal em si (também com visual de post-it) */
.account-modal {
  width: min(360px, 100%);
  background: #f3dd7e;
  border: 1px solid #b8a13a;
  padding: 20px;
  box-sizing: border-box;
  font-family: "Courier Prime", monospace;
  box-shadow: 6px 6px 0 rgba(0,0,0,0.35);
  transform: rotate(-1.5deg);
}
/* Mesma animação de "post-it jogado" usada na caixa de comentários */
.account-modal.postit-in {
  animation: postItThrow 0.5s cubic-bezier(.22, 1.5, .4, 1) both;
}
.account-modal h2 {
  font-family: "Special Elite", monospace;
  font-size: 16px;
  letter-spacing: 2px;
  text-transform: uppercase;
  margin: 0 0 4px 0;
  text-align: center;
  color: var(--stamp-red);
}
.account-modal p.sub {
  font-size: 11px;
  opacity: 0.75;
  text-align: center;
  margin: 0 0 14px 0;
  text-transform: uppercase;
  letter-spacing: 1px;
}
.account-modal label {
  display: block;
  font-size: 11px;
  opacity: 0.85;
  margin: 10px 0 4px 0;
  text-transform: uppercase;
  letter-spacing: 1px;
}
.account-modal input {
  width: 100%;
  background: #fdfaf0;
  border: 1px solid var(--ink);
  color: var(--ink);
  padding: 8px;
  box-sizing: border-box;
  font-family: "Courier Prime", monospace;
}
.account-modal button.primary {
  width: 100%;
  margin-top: 16px;
  padding: 10px;
  background: var(--ink);
  border: none;
  color: var(--paper);
  cursor: pointer;
  font-family: "Special Elite", monospace;
  letter-spacing: 2px;
  text-transform: uppercase;
  font-size: 12px;
}
.account-modal button.primary:hover { background: var(--stamp-red); }
.account-modal .switch-mode {
  margin-top: 12px;
  text-align: center;
  font-size: 11px;
  opacity: 0.8;
  cursor: pointer;
  text-decoration: underline;
  text-transform: uppercase;
  letter-spacing: 1px;
}
.account-modal .error-msg {
  color: var(--stamp-red);
  font-size: 12px;
  margin-top: 10px;
  min-height: 14px;
}
.account-modal .who-box {
  font-size: 13px;
  text-align: center;
  line-height: 1.6;
}
/* =======================================================================
   AJUSTES PRA TELA PEQUENA (celular) — repete várias regras acima
   com valores menores. Se mudar algo lá em cima e não aparecer direito
   no celular, é porque precisa mudar aqui também.
   ======================================================================= */
@media (max-width: 600px) {
  h1 { padding: 18px 12px 4px 12px; font-size: 17px; letter-spacing: 2px; }
  .subtitle { font-size: 9px; letter-spacing: 2px; margin-bottom: 10px; }
  #viewer { height: calc(100vh - 76px); height: calc(100svh - 76px); padding: 10px 12px 12px 12px; }
  .post-wrap { padding-right: 52px; }
  .post { padding: 16px 12px 12px 12px; border-radius: 0; }
  .post.comments-open { height: calc(100svh - 158px) !important; }
  .title { font-size: 15px; margin: 4px 0 12px 0; padding-bottom: 8px; }
  .image-container { width: 88%; }
  .text { font-size: 13px; line-height: 1.6; }
  .tag { font-size: 10px; top: -10px; right: 6px; padding: 3px 8px; }
  .stamp { font-size: 11px; right: -27px; bottom: 10px; padding: 3px 8px; }
  .comment-btn { top: 30px; right: 8px; width: 40px; height: 40px; }
  .account-btn { top: 74px; right: 8px; width: 40px; height: 40px; }
  .body-shell { max-height: calc(100svh - 215px); }
}
</style>
</head>
<body>
<!-- Título e legenda do topo -->
<h1>Universal Local Anomalous Wiki</h1>
<div class="subtitle">Casos anômalos não catalogados</div>

<!-- Aqui dentro o JS injeta o post atual (função showPost) -->
<div id="viewer"></div>
<div class="hint">role 2x (ou use as setas) para acessar o próximo processo</div>

<!-- Modal de criar conta / login. Fica "hidden" até o JS abrir ele. -->
<div class="account-overlay" id="account-overlay" hidden>
  <div class="account-modal" id="account-modal"></div>
</div>

<!-- Painel secreto de denúncias (só aparece com ?painel na URL) -->

// Cria a conta nova: confere se o nome já existe, cria o login no
// Firebase Auth, e grava o nome + o vínculo nome->uid no banco.
async function doCadastro() {
  const nome = document.getElementById("in-nome").value.trim();
  const senha = document.getElementById("in-senha").value;
  const email = document.getElementById("in-email").value.trim();
  setModalError("");

  if (!nome || !senha || !email) {
    setModalError("Preenche os 3 campos.");
    return;
  }
  const nomeKey = sanitizeNomeKey(nome);
  if (!nomeKey) {
    setModalError("Nome inválido.");
    return;
  }

  try {
    const snap = await db.ref("usernames/" + nomeKey).get();
    if (snap.exists()) {
      setModalError("Esse nome já existe. Escolhe outro.");
      return;
    }

    const cred = await auth.createUserWithEmailAndPassword(email, senha);
    const uid = cred.user.uid;

    // grava nome -> uid (regra do banco impede sobrescrever se já existir)
    await db.ref("usernames/" + nomeKey).set(uid);
    await db.ref("users/" + uid).set({ nome: nome });

    currentUid = uid;
    currentNome = nome;
    closeAccountModal();
  } catch (err) {
    console.error(err);
    setModalError(traduzErro(err));
  }
}

// Entra numa conta já existente (usado quando troca de aparelho)
async function doLogin() {

  if (!email || !senha) {

    await auth.signInWithEmailAndPassword(email, senha);

    setModalError(traduzErro(err));
  }
}

// Traduz os códigos de erro do Firebase pra mensagens em português
function traduzErro(err) {
  const code = err && err.code;
  if (code === "auth/email-already-in-use") return "Esse email já tem conta. Usa 'já tenho conta'.";
  if (code === "auth/weak-password") return "Senha muito curta (mínimo 6 caracteres).";
  if (code === "auth/invalid-email") return "Email inválido.";
  if (code === "auth/invalid-credential" || code === "auth/wrong-password" || code === "auth/user-not-found") return "Email ou senha errados.";
  return "Deu erro, tenta de novo.";
}

/* ================== FEED (sorteio de qual post mostrar) ================== */
const viewer = document.getElementById("viewer");
const POSTS_URL = "posts.json"; // arquivo com a lista de posts

// Quantos posts recentes ele "lembra" pra evitar repetir de novo cedo demais
const RECENT_POST_LIMIT = 30;
// Quantos posts recentes ficam totalmente bloqueados de repetir
const RECENT_BLOCK_COUNT = 2;
// Pesos de sorteio por nível de raridade (campo "nivel" no posts.json).
// Quanto MENOR o número, MENOS provável o post aparecer.
// Post sem "nivel" definido usa peso 100 (o mais comum).
// Nível 6 é tratado à parte (ver pickNextPostIndex) e não entra aqui.
const LEVEL_WEIGHTS = { 1: 80, 2: 75, 3: 70, 4: 60, 5: 40 };

let postsData = [];
let currentPostIndex = -1;
let nextPostIndex = -1;
let recentPostIndices = [];
let navigationLocked = false;
let advanceArmed = false;

// Escapa caracteres especiais (<, >, aspas...) antes de jogar texto
// dentro do HTML, pra evitar bug visual ou brecha de segurança.
function escapeHtml(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

// Adiciona um parâmetro único na URL pra forçar o navegador a buscar
// o posts.json de novo em vez de usar uma cópia salva (cache).
function cacheBustUrl(url) {
  return url + (url.includes("?") ? "&" : "?") + "cb=" + Date.now();
}

// Guarda na memória quais posts já apareceram recentemente
function rememberPostIndex(index) {
  if (recentPostIndices.includes(index)) {
    const idx = recentPostIndices.indexOf(index);
    recentPostIndices.splice(idx, 1);
  }
  recentPostIndices.push(index);
  if (recentPostIndices.length > RECENT_POST_LIMIT) recentPostIndices.shift();
}

// Lê o campo "nivel" de um post e devolve um número de 1 a 6,
// ou null se o post não tiver nível definido / for inválido.
function getPostLevel(post) {
  const raw = String(post?.nivel ?? "").trim();
  const level = Number.parseInt(raw, 10);
  if (!Number.isInteger(level)) return null;
  if (level < 1 || level > 6) return null;
  return level;
}

// Devolve o peso de sorteio de um post (ver LEVEL_WEIGHTS acima)
function getPostWeight(post) {
  const level = getPostLevel(post);
  if (level && LEVEL_WEIGHTS[level] != null) return LEVEL_WEIGHTS[level];
  return 100;
}

// Sorteia um post entre uma lista de índices, respeitando os pesos
// (posts com peso maior têm mais chance de serem escolhidos)
function pickWeightedIndex(indices) {
  if (!indices.length) return -1;
  let totalWeight = 0;
  const weights = [];
  for (const index of indices) {
    const baseWeight = Math.max(0, getPostWeight(postsData[index]));
    totalWeight += baseWeight;
    weights.push([index, baseWeight]);
  }
  let roll = Math.random() * totalWeight;
  for (const [index, weight] of weights) {
    roll -= weight;
    if (roll < 0) return index;
  }
  return indices[indices.length - 1];
}

// Decide qual vai ser o PRÓXIMO post mostrado. Tem uma chance bem
// pequena (0.4%) de sortear um post nível 6 (o "easter egg" raro),
// desde que já tenham passado pelo menos 20 posts desde a última vez.
// Fora isso, sorteia normalmente pelos pesos, evitando repetir os
// últimos posts mostrados.
function pickNextPostIndex() {
  const total = postsData.length;
  if (!total) return -1;

  const level6Candidates = [];
  for (let i = 0; i < total; i++) {
    if (getPostLevel(postsData[i]) === 6) {
      const lastSeenIdx = recentPostIndices.lastIndexOf(i);
      const postsPassed = lastSeenIdx === -1 ? Infinity : (recentPostIndices.length - 1 - lastSeenIdx);
      if (postsPassed >= 20 && i !== currentPostIndex) level6Candidates.push(i);
    }
  }
  if (level6Candidates.length > 0 && Math.random() < 0.004) {
    return level6Candidates[Math.floor(Math.random() * level6Candidates.length)];
  }

  const blocked = new Set(recentPostIndices.slice(-RECENT_BLOCK_COUNT));
  let candidates = [];
  for (let i = 0; i < total; i++) {
    if (getPostLevel(postsData[i]) !== 6 && !blocked.has(i) && i !== currentPostIndex) candidates.push(i);
  }
  if (!candidates.length) {
    for (let i = 0; i < total; i++) {
      if (getPostLevel(postsData[i]) !== 6 && i !== currentPostIndex) candidates.push(i);
    }
  }
  if (!candidates.length) return currentPostIndex;
  return pickWeightedIndex(candidates);
}

/* ================== COMENTÁRIOS (Realtime Database) ================== */

// Busca os comentários de um post no banco e desenha a lista,
// já com o botão de denúncia "!" em cada um.
async function loadAndRenderComments(postId) {
  const box = document.getElementById(`comments-${postId}`);
  if (!box) return;
  try {
    const snap = await db.ref("comments/" + postId).get();
    if (!snap.exists()) {
      box.innerHTML = `<div class="comment-empty">Nenhum comentário ainda.</div>`;
      return;
    }
    const items = [];
    snap.forEach((child) => {
      const v = child.val();
      items.push({ key: child.key, nome: v.nome || "?", texto: v.texto || "", ts: v.ts || 0 });
    });
    items.sort((a, b) => a.ts - b.ts);
    box.innerHTML = items.map(c => `
      <div class="comment">
        <div class="comment-row">
          <span><b>${escapeHtml(c.nome)}</b>: ${escapeHtml(c.texto)}</span>
          <button class="report-btn" type="button" title="Denunciar" data-action="report-comment" data-post-id="${postId}" data-comment-id="${c.key}">!</button>
        </div>
      </div>
    `).join("");
  } catch (err) {
    console.error("Erro ao carregar comentários:", err);
    box.innerHTML = `<div class="comment-empty">Erro ao carregar comentários.</div>`;
  }
}

// Abre/fecha a caixa de comentários de um post (e dispara a
// animação de post-it quando abre).
function toggleComments(postId) {
  const el = document.getElementById(`cbox-${postId}`);
  if (!el) return;
  const willOpen = el.hidden;
  el.hidden = !willOpen;
  const postEl = el.closest(".post");
  if (postEl) postEl.classList.toggle("comments-open", willOpen);
  if (willOpen) {
    el.classList.remove("postit-in");
    void el.offsetWidth;
    el.classList.add("postit-in");
    loadAndRenderComments(postId);
  }
}

// Envia uma denúncia pro banco (aparece depois no painel admin)
async function reportComment(postId, commentId) {
  if (!currentUid) {
    openAccountModal("login");
    return;
  }
  try {
    const snap = await db.ref(`comments/${postId}/${commentId}`).get();
    if (!snap.exists()) return;
    const v = snap.val();
    await db.ref(`reports/${postId}__${commentId}`).set({
      postId,
      commentId,
      nome: v.nome || "?",
      texto: v.texto || "",
      ts: firebase.database.ServerValue.TIMESTAMP
    });
    alert("Denunciado.");
  } catch (err) {
    console.error(err);
    alert("Não deu pra denunciar agora.");
  }
}

// Desativa o botão "Registrar" por COOLDOWN_MS milissegundos e
// mostra uma contagem regressiva nele, depois de enviar um comentário.
function startCooldown(btn) {
  if (!btn) return;
  let secondsLeft = Math.ceil(COOLDOWN_MS / 1000);
  btn.disabled = true;
  btn.textContent = `Aguarda ${secondsLeft}s`;
  const timer = setInterval(() => {
    secondsLeft--;
    if (secondsLeft <= 0) {
      clearInterval(timer);
      btn.disabled = false;
      btn.textContent = "Registrar";
    } else {
      btn.textContent = `Aguarda ${secondsLeft}s`;
    }
  }, 1000);
}

// Envia um novo comentário pro banco, com o nome da conta logada.
// Também atualiza o "horário do último comentário" da pessoa, usado
// pra travar o envio muito rápido (ver COOLDOWN_MS e database-rules.json).
async function sendComment(postId) {
  if (!currentUid || !currentNome) {
    openAccountModal("login");
    return;
  }
  const textField = document.getElementById(`text-${postId}`);
  const sendBtn = document.querySelector(`[data-action="send-comment"][data-post-id="${postId}"]`);
  if (sendBtn && sendBtn.disabled) return;
  if (!textField) return;
  const texto = String(textField.value || "").trim();
  if (!texto) {
    alert("Escreve algo antes de enviar.");
    return;
  }
  try {
    await db.ref("comments/" + postId).push({
      nome: currentNome,
      texto: texto,
      ts: firebase.database.ServerValue.TIMESTAMP
    });
    await db.ref("userMeta/" + currentUid).update({ lastCommentTs: firebase.database.ServerValue.TIMESTAMP });
    textField.value = "";
    loadAndRenderComments(postId);
    startCooldown(sendBtn);
  } catch (err) {
    console.error(err);
    alert("Não deu pra enviar o comentário. Se enviou um agora, espera um pouco e tenta de novo.");
  }
}

/* ================== RENDER DOS POSTS ================== */

// Decide qual palavra aparece no carimbo (CONFIDENCIAL, SECRETO...)
// de acordo com o nível de raridade do post. Pra mudar as palavras
// usadas, edita os textos entre aspas abaixo.
function getClassificationLabel(post) {
  const level = getPostLevel(post);
  if (level === 6) return "EXISTÊNCIA NEGADA";
  if (level === 5) return "ULTRASSECRETO";
  if (level === 4) return "SECRETO";
  if (level === 3) return "SIGILOSO";
  if (level === 2 || level === 1) return "RESERVADO";
  return "CONFIDENCIAL";
}

// Monta o HTML de um post inteiro (selo, botões, título, imagem,

      <svg viewBox="0 0 24 24" fill="none" stroke="#201c14" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
      </svg>
    </button>
    <button class="account-btn" type="button" aria-label="Sua conta" data-action="open-account">
      <svg viewBox="0 0 24 24" fill="none" stroke="#201c14" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="8" r="4"></circle>
        <path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"></path>
      </svg>
    </button>
  `;
  html += `<article class="post">`;
  html += `
    <div class="case-meta">
      <span>Processo Nº ${String(index + 1).padStart(4, "0")}</span>
      <span>${escapeHtml(getClassificationLabel(post))}</span>
    </div>
  `;
  if (post.title && String(post.title).trim() !== "") {
    html += `<div class="title">${escapeHtml(post.title)}</div>`;
  }
  html += `<div class="body-shell">`;
  if (post.video && String(post.video).trim() !== "") {
    html += `
      <div class="image-container">
        <video class="main-media loaded" src="${escapeHtml(post.video)}" autoplay loop muted playsinline></video>
      </div>
    `;
  } else if (post.image && String(post.image).trim() !== "") {
    const isGif = /\.gif/i.test(post.image);
    html += `
      <div class="image-container">
        <img class="main-media"
          src="${escapeHtml(post.image)}"
          ${isGif ? '' : 'decoding="async"'}
          alt=""
          onload="this.classList.add('loaded')"
          onerror="this.classList.add('loaded'); console.error('Erro ao processar mídia.');">
      </div>
    `;
  }
  html += `
      <div class="text-shell">
        <div class="text">${escapeHtml(post.text || "")}</div>
      </div>
    </div>
    <div class="stamp">${escapeHtml(getClassificationLabel(post))}</div>
    <div class="comment-box" id="cbox-${postId}" hidden>
      <div class="comment-list" id="comments-${postId}"></div>
      <div class="comment-form">
        <div class="as-who">testemunho registrado como <b>${escapeHtml(currentNome || "?")}</b></div>
        <textarea id="text-${postId}" placeholder="Relate o que presenciou..."></textarea>
        <button type="button" data-action="send-comment" data-post-id="${postId}">Registrar</button>
      </div>
    </div>
  </article>
  `;
  wrap.innerHTML = html;
  return wrap;
}

// Troca o post que está na tela pelo post de índice "index",
// disparando a animação de folha virando.
function showPost(index) {
  if (index < 0 || index >= postsData.length) return;
  currentPostIndex = index;
  rememberPostIndex(index);
  const el = createPostElement(postsData[index], index);
  el.classList.add("page-enter");
  viewer.replaceChildren(el);
  window.scrollTo(0, 0);
  advanceArmed = false;
  nextPostIndex = pickNextPostIndex();
  if (nextPostIndex >= 0 && postsData[nextPostIndex].image && (!postsData[nextPostIndex].video || String(postsData[nextPostIndex].video).trim() === "")) {
    const imgPreload = new Image();
    imgPreload.src = postsData[nextPostIndex].image;
  }
}

// Avança pro próximo post (chamado pelo scroll/seta/toque)
function advanceToNextPost() {
  if (navigationLocked) return;
  navigationLocked = true;
  setTimeout(() => { navigationLocked = false; }, 550);
  if (nextPostIndex >= 0) {
    showPost(nextPostIndex);
  } else {
    const fallbackIndex = pickNextPostIndex();
    if (fallbackIndex >= 0) showPost(fallbackIndex);
  }
}

// Verifica se o clique/toque foi dentro de um campo de texto, pra
// não avançar de post sem querer enquanto a pessoa está digitando.
function isEditableTarget(target) {
  if (!(target instanceof Element)) return false;
  return Boolean(target.closest("input, textarea, select, [contenteditable='true']"));
}
function getScrollableContainer(target) {
  if (!(target instanceof Element)) return null;
  return target.closest(".comment-list") || target.closest(".body-shell");
}
function canScrollDown(el) { return el.scrollTop + el.clientHeight < el.scrollHeight - 1; }
function canScrollUp(el) { return el.scrollTop > 1; }

// Navegação por scroll do mouse: precisa de 2 scrolls seguidos pra
// avançar de post (o primeiro só "arma", o segundo avança de fato).
document.addEventListener("wheel", (event) => {
  const scroller = getScrollableContainer(event.target);
  if (scroller) {
    if (event.deltaY > 0 && canScrollDown(scroller)) { advanceArmed = false; return; }
    if (event.deltaY < 0 && canScrollUp(scroller)) { advanceArmed = false; return; }
  }
  if (event.deltaY > 0) {
    event.preventDefault();
    if (advanceArmed) { advanceArmed = false; advanceToNextPost(); }
    else { advanceArmed = true; }
  } else if (event.deltaY < 0) {
    advanceArmed = false;
  }
}, { passive: false });

// Navegação pelo teclado (seta pra baixo, espaço ou enter)
document.addEventListener("keydown", (event) => {
  if (isEditableTarget(document.activeElement)) return;
  if (event.key === "ArrowDown" || event.key === "PageDown" || event.key === " " || event.key === "Enter") {
    event.preventDefault();
    advanceToNextPost();
  }
});

// Navegação por toque no celular (mesma lógica dos 2 scrolls,
// mas com "arrastar de baixo pra cima")
let touchStartY = 0;
let touchStartTarget = null;
document.addEventListener("touchstart", (event) => {
  const touch = event.touches[0];
  touchStartY = touch.clientY;
  touchStartTarget = event.target instanceof Element ? event.target : null;
}, { passive: true });

document.addEventListener("touchend", (event) => {
  if (isEditableTarget(touchStartTarget)) return;
  const touch = event.changedTouches[0];
  const deltaY = touch.clientY - touchStartY;
  const scroller = getScrollableContainer(touchStartTarget);
  if (deltaY < -60) {
    if (scroller && canScrollDown(scroller)) { advanceArmed = false; return; }
    if (advanceArmed) { advanceArmed = false; advanceToNextPost(); }
    else { advanceArmed = true; }
  } else if (deltaY > 60) {
    advanceArmed = false;
  }
}, { passive: true });

// Roteador central de cliques dentro do feed: cada botão tem um
// atributo "data-action" que diz o que fazer (abrir comentário,
// abrir conta, enviar comentário, denunciar).
viewer.addEventListener("click", (event) => {
  const actionEl = event.target.closest("[data-action]");
  if (!actionEl) return;
  const action = actionEl.dataset.action;
  if (action === "open-account") {
    openAccountModal(currentUid ? "conta" : "login");
    return;
  }
  const postId = actionEl.dataset.postId;
  if (!postId) return;
  if (action === "toggle-comments") toggleComments(postId);
  else if (action === "send-comment") sendComment(postId);
  else if (action === "report-comment") reportComment(postId, actionEl.dataset.commentId);
});

// Carrega o posts.json e mostra o primeiro post sorteado.
// Só é chamado quando NÃO é a rota do painel admin (ver o "if" no
// final do arquivo).
async function init() {
  try {
    const res = await fetch(cacheBustUrl(POSTS_URL));
    if (!res.ok) throw new Error(`Falha ao carregar posts.json: HTTP ${res.status}`);
    const posts = await res.json();
    postsData = Array.isArray(posts) ? posts : [];
    if (!postsData.length) {
      viewer.innerHTML = "<p>Sem posts no momento.</p>";
      return;
    }
    showPost(pickNextPostIndex());
  } catch (err) {
    console.error(err);
    viewer.innerHTML = "<p>Erro ao carregar posts.json</p>";
  }
}

if (!isAdminRoute) init();
</script>
